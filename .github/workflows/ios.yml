name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd "tools tiktok"
          npm install

      - name: Prepare web files
        run: |
          cd "tools tiktok"
          npm run prepare-build

      - name: Add Capacitor iOS
        run: |
          cd "tools tiktok"
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd "tools tiktok/ios/App"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -archivePath build/App.xcarchive archive
          
          cd build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -R App.app Payload/
          zip -r ../../../../../MyVault.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MyVault-IPA
          path: "tools tiktok/MyVault.ipa"
